# Render blueprint. DEPLOYMENT.md §4. Deploy via Render's "New Blueprint"
# pointed at this repo; `sync: false` vars are entered once in the Render
# dashboard (secrets), `generateValue: true` is generated by Render itself.
services:
  - type: web
    name: screening-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Red-team finding #8: `next start` (what `pnpm start` runs) warns it is
    # not compatible with `output: "standalone"` (next.config.ts) — it
    # happened to still serve requests correctly, but defeated the whole
    # cold-start/image-size rationale for choosing standalone output
    # (ARCHITECTURE.md §5.3/§10). `next build` with `output: "standalone"`
    # emits `.next/standalone/server.js` plus a `.next/standalone/` tree
    # that does NOT include `public/` or `.next/static/` (Next copies the
    # traced server deps there but deliberately leaves static assets out —
    # they're expected to be copied alongside by the build step); the extra
    # `cp` below does that copy so the standalone server can actually serve
    # `/` and every static asset, not just API routes. Verified locally:
    # `pnpm build` -> the two `cp`s below -> `node .next/standalone/server.js`
    # -> real HTML on `/jobs/student-tech-2026` and correct `/_next/static/*`
    # assets, not just `/api/health`.
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile && pnpm build &&
      cp -r public .next/standalone/public &&
      cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CANDIDATE_COOKIE_SECRET
        generateValue: true
      - key: ITEM_TOKEN_SECRET
        generateValue: true
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALERT_EMAIL
        sync: false
# Node version is pinned in package.json ("engines": {"node": "22.x"}) and
# .node-version; Render reads it. MIGRATION_DATABASE_URL is deliberately
# NOT listed here — it must never exist on Render (DEPLOYMENT.md §3).
