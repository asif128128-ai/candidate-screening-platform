# Render blueprint. DEPLOYMENT.md §4. Deploy via Render's "New Blueprint"
# pointed at this repo; `sync: false` vars are entered once in the Render
# dashboard (secrets), `generateValue: true` is generated by Render itself.
services:
  - type: web
    name: screening-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CANDIDATE_COOKIE_SECRET
        generateValue: true
      - key: ITEM_TOKEN_SECRET
        generateValue: true
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ALERT_EMAIL
        sync: false
# Node version is pinned in package.json ("engines": {"node": "22.x"}) and
# .node-version; Render reads it. MIGRATION_DATABASE_URL is deliberately
# NOT listed here — it must never exist on Render (DEPLOYMENT.md §3).
